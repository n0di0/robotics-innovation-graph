name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r robotics-innovation-graph/requirements.txt
        pip install gunicorn
    
    - name: Build static files
      run: |
        cd robotics-innovation-graph
        python -c "
import json
with open('data.json') as f:
    data = json.load(f)
print('Data loaded successfully')
"
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./robotics-innovation-graph
        cname: robotics-graph.yourdomain.com  # Optional: your custom domain
