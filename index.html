<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic Innovations Timeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .header {
            background: #222222;
            border-bottom: 2px solid #c0c0c0;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .header-subtext {
            font-size: 12px;
            color: #a0a0a0;
            letter-spacing: 0.5px;
        }

        .controls-section {
            background: #262626;
            padding: 15px 30px;
            border-bottom: 1px solid #404040;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-toggle label {
            color: #c0c0c0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-weight: 500;
        }

        .toggle-checkbox {
            appearance: none;
            width: 40px;
            height: 20px;
            background: #3a3a3a;
            border: 2px solid #606060;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .toggle-checkbox:checked {
            background: #c0c0c0;
            border-color: #c0c0c0;
        }

        .toggle-checkbox::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #1a1a1a;
            border-radius: 6px;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }

        .toggle-checkbox:checked::after {
            left: 19px;
            background: #222222;
        }

        .filter-options {
            display: flex;
            gap: 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .filter-options.visible {
            max-height: 100px;
            margin-top: 10px;
        }

        .category-filter, .timeline-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            background: #3a3a3a;
            border: 1px solid #606060;
            color: #a0a0a0;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: #c0c0c0;
            color: #c0c0c0;
            background: #404040;
        }

        .filter-btn.active {
            background: #c0c0c0;
            color: #1a1a1a;
            border-color: #c0c0c0;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .visualization-container {
            flex: 1;
            position: relative;
            background: #1a1a1a;
        }

        #network {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }

        .sidebar {
            width: 0;
            background: #222222;
            border-left: 2px solid #c0c0c0;
            overflow-y: auto;
            transition: width 0.3s ease;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            width: 320px;
        }

        .sidebar-content {
            padding: 30px 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar.open .sidebar-content {
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 15px;
            background: none;
            border: 1px solid #c0c0c0;
            color: #c0c0c0;
            width: 28px;
            height: 28px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #c0c0c0;
            color: #1a1a1a;
        }

        .node-title {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 15px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
            font-weight: 500;
        }

        .node-detail {
            margin-bottom: 18px;
        }

        .detail-label {
            font-size: 10px;
            color: #808080;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 12px;
            color: #d0d0d0;
            line-height: 1.6;
        }

        .detail-tag {
            display: inline-block;
            background: #3a3a3a;
            color: #c0c0c0;
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 10px;
            margin: 3px 5px 3px 0;
            font-weight: 500;
            border: 1px solid #606060;
        }

        .tooltip {
            background: rgba(26, 26, 26, 0.98);
            border: 1px solid #606060;
            border-radius: 4px;
            padding: 12px;
            font-size: 12px;
            max-width: 250px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        }

        .tooltip-title {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        .tooltip-text {
            color: #b0b0b0;
            font-size: 11px;
            line-height: 1.5;
        }

        /* Custom scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #606060;
            border-radius: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #c0c0c0;
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #606060;
            border-radius: 4px;
            padding: 15px;
            font-size: 11px;
            max-width: 200px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #606060;
        }

        .legend-text {
            color: #a0a0a0;
            font-size: 10px;
        }

        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .loading-spinner {
            border: 3px solid rgba(192, 192, 192, 0.1);
            border-top: 3px solid #c0c0c0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #c0c0c0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Robotic Innovations Timeline</h1>
            <div class="header-subtext">Interactive knowledge graph | Past → Present → Future</div>
        </div>

        <div class="controls-section">
            <div class="filter-toggle">
                <label for="filterToggle">Filters</label>
                <input type="checkbox" id="filterToggle" class="toggle-checkbox">
            </div>
            <div class="filter-options" id="filterOptions">
                <div>
                    <div style="color: #c0c0c0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: 600;">Category:</div>
                    <div class="category-filter" id="categoryFilter"></div>
                </div>
                <div>
                    <div style="color: #c0c0c0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: 600;">Timeline:</div>
                    <div class="timeline-filter" id="timelineFilter">
                        <button class="filter-btn active" data-period="all">All Eras</button>
                        <button class="filter-btn" data-period="past">Past (Pre-2020)</button>
                        <button class="filter-btn" data-period="present">Present (2020-2026)</button>
                        <button class="filter-btn" data-period="future">Future (2026+)</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="visualization-container">
                <div id="network"></div>
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading timeline...</div>
                </div>
                <div class="legend" id="legend"></div>
            </div>

            <div class="sidebar" id="sidebar">
                <button class="close-btn" id="closeSidebar">&times;</button>
                <div class="sidebar-content" id="sidebarContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Global data container
        let ROBOTICS_DATA = null;
        let network = null;

        async function loadData() {
            try {
                const response = await fetch('robotics_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                ROBOTICS_DATA = await response.json();
                initializeVisualization();
            } catch (error) {
                console.error('Error loading data:', error);
                console.log('Tried to fetch: robotics_data.json from current directory');
                document.getElementById('loading').innerHTML = '<div style="color: #c0c0c0; padding: 20px;">Error: Could not load robotics_data.json<br><br>Make sure both files are in the same folder:<br>• robotics_timeline.html<br>• robotics_data.json<br><br>Check browser console for details.</div>';
            }
        }

        function initializeVisualization() {
            // ===== DATA PROCESSING =====
            const categories = new Map();
            const nodeData = [];
            const edgeData = [];
            const nodeDetails = new Map();

            // Extract unique years from all articles
            const allYears = new Set();
            
            // Process articles into nodes
            Object.entries(ROBOTICS_DATA.articles).forEach(([key, article]) => {
                // Determine category based on article metadata
                let category = 'Other';
                if (article.categories && Array.isArray(article.categories)) {
                    if (article.categories.some(c => c.includes('Robotics') || c.includes('robot'))) {
                        category = 'Core Robotics';
                    } else if (article.categories.some(c => c.includes('Artificial intelligence') || c.includes('AI'))) {
                        category = 'AI & Learning';
                    } else if (article.categories.some(c => c.includes('Manufacturing') || c.includes('Industrial'))) {
                        category = 'Manufacturing';
                    } else if (article.categories.some(c => c.includes('Control') || c.includes('Automation'))) {
                        category = 'Control Systems';
                    } else if (article.categories.some(c => c.includes('Material') || c.includes('Engineer'))) {
                        category = 'Materials & Engineering';
                    } else if (article.categories.some(c => c.includes('Sensor') || c.includes('Vision') || c.includes('Perception'))) {
                        category = 'Sensing & Perception';
                    }
                }

                // Get primary year or average year
                let primaryYear = 2026; // default to present
                if (article.year_mentions && Array.isArray(article.year_mentions) && article.year_mentions.length > 0) {
                    primaryYear = article.year_mentions[article.year_mentions.length - 1];
                    article.year_mentions.forEach(y => allYears.add(y));
                }

                // Calculate importance from relationships and links
                const importance = Math.min(100, Math.max(10, (article.relationships || 0) + (article.links_found || 0) / 50));

                // Determine color based on year (grey to silver/gold gradient)
                const colorValue = getColorForYear(primaryYear);

                // Create node
                nodeData.push({
                    id: key,
                    label: article.title,
                    title: article.title,
                    category: category,
                    year: primaryYear,
                    size: importance,
                    color: colorValue,
                    physics: true,
                    x: (primaryYear - 1950) * 20, // Chronological X positioning
                });

                // Store details
                nodeDetails.set(key, {
                    title: article.title,
                    category: category,
                    year: primaryYear,
                    relationships: article.relationships || 0,
                    linksFound: article.links_found || 0,
                    textLength: article.text_length || 0,
                    description: article.predictions?.forward_trajectory?.future_impact || 'Innovation in robotic systems.',
                    applications: article.predictions?.forward_trajectory?.emerging_applications || [],
                    convergence: article.predictions?.forward_trajectory?.convergence_with || [],
                    predecessors: article.predictions?.predecessors?.direct_predecessors || [],
                    criticality: article.predictions?.backward_analysis?.criticality_level || 'medium'
                });

                // Track categories
                if (!categories.has(category)) {
                    categories.set(category, []);
                }
                categories.get(category).push(key);
            });

            // Create edges based on parent-child relationships
            Object.entries(ROBOTICS_DATA.articles).forEach(([key, article]) => {
                if (article.parent && ROBOTICS_DATA.articles[article.parent]) {
                    edgeData.push({
                        from: article.parent,
                        to: key,
                        smooth: { type: 'cubicBezier', forceDirection: 'horizontal' },
                        color: { color: 'rgba(192, 192, 192, 0.15)' },
                        arrows: 'to',
                        width: 1.5
                    });
                }
            });

            // ===== COLOR MAPPING =====
            function getColorForYear(year) {
                // Grey to silver gradient, with gold hint
                const currentYear = 2026;
                const startYear = 1950;
                const range = currentYear - startYear;
                const progress = (year - startYear) / range;

                // Clamp between 0 and 1
                const clampedProgress = Math.max(0, Math.min(1, progress));

                // Grey: #4a4a4a, Silver: #c0c0c0, with gold hint
                const baseR = 74, baseG = 74, baseB = 74;
                const silverR = 192, silverG = 192, silverB = 192;

                const r = Math.round(baseR + (silverR - baseR) * clampedProgress);
                const g = Math.round(baseG + (silverG - baseG) * clampedProgress);
                const b = Math.round(baseB + (silverB - baseB) * clampedProgress);

                return {
                    background: `rgb(${r},${g},${b})`,
                    border: '#c0c0c0',
                    highlight: { background: '#e0e0e0', border: '#ffffff' }
                };
            }

            // ===== VIS.JS NETWORK =====
            const container = document.getElementById('network');
            const nodesCollection = new vis.DataSet(nodeData);
            const edgesCollection = new vis.DataSet(edgeData);

            const data = {
                nodes: nodesCollection,
                edges: edgesCollection
            };

            const options = {
                physics: {
                    enabled: true,
                    barnesHut: {
                        gravitationalConstant: -15000,
                        centralGravity: 0.3,
                        springLength: 200,
                        springConstant: 0.04
                    },
                    minVelocity: 0.75,
                    solver: 'barnesHut',
                    timestep: 0.5,
                    adaptiveTimestep: true
                },
                nodes: {
                    shape: 'circle',
                    borderWidth: 2,
                    borderWidthSelected: 3,
                    font: {
                        size: 13,
                        color: '#000000',
                        face: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif',
                        bold: { color: '#ffffff' }
                    },
                    scaling: {
                        min: 15,
                        max: 40
                    },
                    physics: true
                },
                edges: {
                    width: 1.5,
                    color: { color: 'rgba(192, 192, 192, 0.15)' },
                    smooth: {
                        type: 'continuous',
                        forceDirection: 'none'
                    },
                    arrows: {
                        to: { enabled: false, scaleFactor: 0.5 }
                    }
                },
                interaction: {
                    navigationButtons: false,
                    keyboard: false,
                    hover: true,
                    zoomView: true,
                    dragView: true
                },
                configure: false
            };

            network = new vis.Network(container, data, options);

            // ===== EVENT HANDLERS =====
            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const details = nodeDetails.get(nodeId);
                    if (details) {
                        showSidebar(details);
                    }
                }
            });

            network.on('hoverNode', function(params) {
                const nodeId = params.node;
                const details = nodeDetails.get(nodeId);
                if (details) {
                    showTooltip(params.event, details);
                }
            });

            network.on('blurNode', function() {
                hideTooltip();
            });

            // ===== SIDEBAR =====
            function showSidebar(details) {
                const sidebar = document.getElementById('sidebar');
                const content = document.getElementById('sidebarContent');

                let html = `<div class="node-title">${details.title}</div>`;
                html += `<div class="node-detail">
                    <div class="detail-label">Category</div>
                    <div class="detail-value">${details.category}</div>
                </div>`;
                html += `<div class="node-detail">
                    <div class="detail-label">Year</div>
                    <div class="detail-value">${details.year}</div>
                </div>`;
                html += `<div class="node-detail">
                    <div class="detail-label">Criticality</div>
                    <div class="detail-value"><span class="detail-tag">${details.criticality.toUpperCase()}</span></div>
                </div>`;
                html += `<div class="node-detail">
                    <div class="detail-label">Impact Metrics</div>
                    <div class="detail-value">
                        Relationships: ${details.relationships}<br>
                        Links: ${details.linksFound}<br>
                        Text: ${(details.textLength / 1000).toFixed(1)}k chars
                    </div>
                </div>`;
                
                if (details.applications && details.applications.length > 0) {
                    html += `<div class="node-detail">
                        <div class="detail-label">Applications</div>
                        <div class="detail-value">`;
                    details.applications.slice(0, 3).forEach(app => {
                        html += `<div style="margin-bottom: 6px; font-size: 11px;">• ${app}</div>`;
                    });
                    html += `</div></div>`;
                }

                if (details.convergence && details.convergence.length > 0) {
                    html += `<div class="node-detail">
                        <div class="detail-label">Convergence</div>
                        <div class="detail-value">`;
                    details.convergence.slice(0, 3).forEach(field => {
                        html += `<span class="detail-tag">${field}</span>`;
                    });
                    html += `</div></div>`;
                }

                html += `<div class="node-detail">
                    <div class="detail-label">Description</div>
                    <div class="detail-value">${details.description}</div>
                </div>`;

                content.innerHTML = html;
                sidebar.classList.add('open');
            }

            function hideSidebar() {
                document.getElementById('sidebar').classList.remove('open');
            }

            document.getElementById('closeSidebar').addEventListener('click', hideSidebar);

            // ===== TOOLTIP =====
            let tooltipElement;

            function showTooltip(event, details) {
                if (!tooltipElement) {
                    tooltipElement = document.createElement('div');
                    tooltipElement.className = 'tooltip';
                    document.body.appendChild(tooltipElement);
                }

                let tooltipHtml = `<div class="tooltip-title">${details.title}</div>`;
                tooltipHtml += `<div class="tooltip-text"><strong>Category:</strong> ${details.category}</div>`;
                tooltipHtml += `<div class="tooltip-text"><strong>Year:</strong> ${details.year}</div>`;
                tooltipHtml += `<div class="tooltip-text"><strong>Relationships:</strong> ${details.relationships}</div>`;

                tooltipElement.innerHTML = tooltipHtml;
                tooltipElement.style.display = 'block';
                tooltipElement.style.position = 'fixed';
                tooltipElement.style.left = (event.pageX + 10) + 'px';
                tooltipElement.style.top = (event.pageY + 10) + 'px';
                tooltipElement.style.zIndex = '1000';
            }

            function hideTooltip() {
                if (tooltipElement) {
                    tooltipElement.style.display = 'none';
                }
            }

            // Track tooltip position
            document.addEventListener('mousemove', function(e) {
                if (tooltipElement && tooltipElement.style.display === 'block') {
                    tooltipElement.style.left = (e.pageX + 10) + 'px';
                    tooltipElement.style.top = (e.pageY + 10) + 'px';
                }
            });

            // ===== FILTERS =====
            const filterToggle = document.getElementById('filterToggle');
            const filterOptions = document.getElementById('filterOptions');

            filterToggle.addEventListener('change', function() {
                filterOptions.classList.toggle('visible', this.checked);
            });

            // Populate category filters
            const categoryFilter = document.getElementById('categoryFilter');
            categories.forEach((nodes, category) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn active';
                btn.textContent = category;
                btn.dataset.category = category;
                btn.addEventListener('click', function() {
                    this.classList.toggle('active');
                    applyFilters();
                });
                categoryFilter.appendChild(btn);
            });

            // Timeline filter buttons
            const timelineButtons = document.querySelectorAll('[data-period]');
            timelineButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    applyFilters();
                });
            });

            function applyFilters() {
                const activeCategories = new Set();
                document.querySelectorAll('.category-filter .filter-btn.active').forEach(btn => {
                    activeCategories.add(btn.dataset.category);
                });

                const activePeriod = document.querySelector('[data-period].active').dataset.period;

                nodesCollection.forEach(node => {
                    const details = nodeDetails.get(node.id);
                    let showNode = activeCategories.has(details.category);

                    if (activePeriod === 'past') {
                        showNode = showNode && details.year < 2020;
                    } else if (activePeriod === 'present') {
                        showNode = showNode && details.year >= 2020 && details.year <= 2026;
                    } else if (activePeriod === 'future') {
                        showNode = showNode && details.year > 2026;
                    }

                    nodesCollection.update({ id: node.id, hidden: !showNode });
                });
            }

            // ===== LEGEND =====
            function populateLegend() {
                const legend = document.getElementById('legend');
                let html = '<strong style="color: #ffffff; display: block; margin-bottom: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Color Legend</strong>';
                html += '<div class="legend-item"><div class="legend-color" style="background: #4a4a4a;"></div><div class="legend-text">Historical (Pre-2020)</div></div>';
                html += '<div class="legend-item"><div class="legend-color" style="background: #8a8a8a;"></div><div class="legend-text">Recent (2020-2026)</div></div>';
                html += '<div class="legend-item"><div class="legend-color" style="background: #c0c0c0;"></div><div class="legend-text">Future (Post-2026)</div></div>';
                legend.innerHTML = html;
            }

            // ===== INITIALIZATION =====
            network.on('stabilizationIterationsDone', function() {
                document.getElementById('loading').style.display = 'none';
                network.setOptions({ physics: false });
            });

            populateLegend();

            // Auto-stabilize after timeout
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                network.setOptions({ physics: false });
            }, 5000);
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
