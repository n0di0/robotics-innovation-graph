<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic Innovations - 3D Timeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(34, 34, 34, 0.95);
            border-bottom: 2px solid #c0c0c0;
            padding: 20px 30px;
            pointer-events: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .header-subtext {
            font-size: 12px;
            color: #a0a0a0;
            letter-spacing: 0.5px;
        }

        .controls {
            position: absolute;
            top: 100px;
            left: 30px;
            background: rgba(34, 34, 34, 0.95);
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            pointer-events: auto;
            max-width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }

        .control-title {
            font-size: 12px;
            color: #c0c0c0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 10px;
            border-bottom: 1px solid #404040;
            padding-bottom: 8px;
        }

        .filter-btn {
            padding: 6px 10px;
            background: #3a3a3a;
            border: 1px solid #606060;
            color: #a0a0a0;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 3px 3px 3px 0;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: #c0c0c0;
            color: #c0c0c0;
            background: #404040;
        }

        .filter-btn.active {
            background: #c0c0c0;
            color: #1a1a1a;
            border-color: #c0c0c0;
        }

        .tooltip {
            position: absolute;
            background: rgba(26, 26, 26, 0.98);
            border: 1px solid #606060;
            border-radius: 4px;
            padding: 12px;
            font-size: 12px;
            max-width: 250px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        }

        .tooltip-title {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        .tooltip-text {
            color: #b0b0b0;
            font-size: 11px;
            line-height: 1.5;
        }

        .sidebar {
            position: absolute;
            right: 0;
            top: 0;
            width: 0;
            height: 100vh;
            background: rgba(34, 34, 34, 0.98);
            border-left: 2px solid #c0c0c0;
            overflow-y: auto;
            transition: width 0.3s ease;
            pointer-events: auto;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
            z-index: 200;
        }

        .sidebar.open {
            width: 320px;
        }

        .sidebar-content {
            padding: 30px 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar.open .sidebar-content {
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 15px;
            background: none;
            border: 1px solid #c0c0c0;
            color: #c0c0c0;
            width: 28px;
            height: 28px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 210;
        }

        .close-btn:hover {
            background: #c0c0c0;
            color: #1a1a1a;
        }

        .node-title {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 15px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
            font-weight: 500;
        }

        .node-detail {
            margin-bottom: 18px;
        }

        .detail-label {
            font-size: 10px;
            color: #808080;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 12px;
            color: #d0d0d0;
            line-height: 1.6;
        }

        .detail-tag {
            display: inline-block;
            background: #3a3a3a;
            color: #c0c0c0;
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 10px;
            margin: 3px 5px 3px 0;
            font-weight: 500;
            border: 1px solid #606060;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 30px;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #606060;
            border-radius: 4px;
            padding: 15px;
            font-size: 11px;
            pointer-events: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #606060;
        }

        .legend-text {
            color: #a0a0a0;
            font-size: 10px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 500;
            pointer-events: auto;
            background: rgba(26, 26, 26, 0.95);
            padding: 30px;
            border-radius: 4px;
            border: 1px solid #606060;
        }

        .loading-spinner {
            border: 3px solid rgba(192, 192, 192, 0.1);
            border-top: 3px solid #c0c0c0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #c0c0c0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
        }

        .controls::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .controls::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .controls::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: #606060;
            border-radius: 4px;
        }

        .controls::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #c0c0c0;
        }

        .info-text {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 11px;
            color: #a0a0a0;
            background: rgba(34, 34, 34, 0.95);
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 10px 15px;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="canvas"></div>

    <div class="ui-container">
        <div class="header">
            <h1>Robotic Innovations Timeline</h1>
            <div class="header-subtext">3D Interactive Knowledge Graph | Drag to rotate • Scroll to zoom • Click nodes for details</div>
        </div>

        <div class="controls">
            <div class="control-title">Filter by Category</div>
            <div id="categoryFilters"></div>
        </div>

        <div class="tooltip" id="tooltip">
            <div class="tooltip-title" id="tooltipTitle"></div>
            <div class="tooltip-text" id="tooltipText"></div>
        </div>

        <div class="sidebar" id="sidebar">
            <button class="close-btn" id="closeSidebar">&times;</button>
            <div class="sidebar-content" id="sidebarContent"></div>
        </div>

        <div class="legend" id="legend"></div>

        <div class="info-text">
            DRAG • SCROLL • CLICK
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading timeline...</div>
            <div class="error-message" id="errorMsg"></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let nodes = [];
        let nodeDetails = new Map();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredNode = null;
        let selectedNode = null;
        let categories = new Map();
        let rawData = null;

        // Load JSON data
        async function loadData() {
            try {
                const response = await fetch('robotics_knowledge_base_with_predictions.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                rawData = await response.json();
                console.log('✓ Data loaded successfully');
                initThreeJS();
            } catch (error) {
                console.error('Error loading JSON:', error);
                document.getElementById('errorMsg').textContent = `Error: ${error.message}`;
                document.getElementById('loading').style.background = 'rgba(200, 50, 50, 0.3)';
            }
        }

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x1a1a1a, 1500, 3000);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 300, 800);
            camera.lookAt(0, 0, 0);

            // Renderer
            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(500, 500, 500);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = true;

            // Process data
            processData();

            // UI
            populateFilters();
            populateLegend();

            // Events
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            window.addEventListener('resize', onWindowResize);
            document.getElementById('closeSidebar').addEventListener('click', closeSidebar);

            // Hide loading
            document.getElementById('loading').style.display = 'none';

            // Animate
            animate();
        }

        function processData() {
            const minYear = 1950;
            const maxYear = 2036;

            Object.entries(rawData.articles).forEach(([key, article]) => {
                // Category
                let category = 'Other';
                if (article.categories && Array.isArray(article.categories)) {
                    const cats = article.categories.join(' ').toLowerCase();
                    if (cats.includes('robotics') || cats.includes('robot')) {
                        category = 'Core Robotics';
                    } else if (cats.includes('artificial intelligence') || cats.includes('ai')) {
                        category = 'AI & Learning';
                    } else if (cats.includes('manufacturing') || cats.includes('industrial')) {
                        category = 'Manufacturing';
                    } else if (cats.includes('control') || cats.includes('automation')) {
                        category = 'Control Systems';
                    } else if (cats.includes('material') || cats.includes('engineer')) {
                        category = 'Materials & Engineering';
                    } else if (cats.includes('sensor') || cats.includes('vision') || cats.includes('perception')) {
                        category = 'Sensing & Perception';
                    }
                }

                // Year
                let year = 2026;
                if (article.year_mentions && article.year_mentions.length > 0) {
                    year = article.year_mentions[article.year_mentions.length - 1];
                }

                // Size
                const importance = Math.min(100, Math.max(10, (article.relationships || 0) + (article.links_found || 0) / 50));
                const size = (importance / 100) * 30 + 10;

                // Color (grey to silver)
                const progress = (year - minYear) / (maxYear - minYear);
                const clampedProgress = Math.max(0, Math.min(1, progress));
                const r = Math.round(74 + (192 - 74) * clampedProgress);
                const g = Math.round(74 + (192 - 74) * clampedProgress);
                const b = Math.round(74 + (192 - 74) * clampedProgress);
                const color = new THREE.Color(`rgb(${r}, ${g}, ${b})`);

                // Position (horizontal timeline + random scatter)
                const x = ((year - minYear) / (maxYear - minYear)) * 1200 - 600;
                const y = (Math.random() - 0.5) * 400;
                const z = (Math.random() - 0.5) * 300;

                // Mesh
                const geometry = new THREE.SphereGeometry(size, 32, 32);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.3,
                    roughness: 0.4,
                    emissive: color,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = { id: key, year, category, importance };

                scene.add(mesh);
                nodes.push(mesh);

                // Details
                nodeDetails.set(key, {
                    title: article.title,
                    category: category,
                    year: year,
                    relationships: article.relationships || 0,
                    linksFound: article.links_found || 0,
                    textLength: article.text_length || 0,
                    description: article.predictions?.forward_trajectory?.future_impact || 'Innovation in robotic systems.',
                    applications: article.predictions?.forward_trajectory?.emerging_applications || [],
                    convergence: article.predictions?.forward_trajectory?.convergence_with || [],
                    criticality: article.predictions?.backward_analysis?.criticality_level || 'medium'
                });

                // Track categories
                if (!categories.has(category)) {
                    categories.set(category, []);
                }
                categories.get(category).push(key);
            });

            // Timeline axis
            const axisGeometry = new THREE.BufferGeometry();
            const axisPoints = [new THREE.Vector3(-600, 0, 0), new THREE.Vector3(600, 0, 0)];
            axisGeometry.setFromPoints(axisPoints);
            const axisMaterial = new THREE.LineBasicMaterial({ color: 0x606060, linewidth: 2 });
            const axisLine = new THREE.Line(axisGeometry, axisMaterial);
            scene.add(axisLine);

            // Year markers
            [1950, 1980, 2010, 2026, 2036].forEach(y => {
                const xPos = ((y - 1950) / (2036 - 1950)) * 1200 - 600;
                const geometry = new THREE.BoxGeometry(2, 20, 2);
                const material = new THREE.MeshStandardMaterial({ color: 0x606060 });
                const marker = new THREE.Mesh(geometry, material);
                marker.position.set(xPos, -50, 0);
                scene.add(marker);
            });
        }

        function populateFilters() {
            const container = document.getElementById('categoryFilters');
            categories.forEach((nodeIds, category) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn active';
                btn.textContent = category;
                btn.dataset.category = category;
                btn.addEventListener('click', function() {
                    this.classList.toggle('active');
                    applyFilters();
                });
                container.appendChild(btn);
            });
        }

        function applyFilters() {
            const activeCategories = new Set();
            document.querySelectorAll('.filter-btn.active').forEach(btn => {
                activeCategories.add(btn.dataset.category);
            });

            nodes.forEach(node => {
                const details = nodeDetails.get(node.userData.id);
                node.visible = activeCategories.has(details.category);
            });
        }

        function populateLegend() {
            const legend = document.getElementById('legend');
            let html = '<strong style="color: #ffffff; display: block; margin-bottom: 10px; font-size: 11px;">Timeline Colors</strong>';
            html += '<div class="legend-item"><div class="legend-color" style="background: #4a4a4a;"></div><div class="legend-text">Historical (1950s)</div></div>';
            html += '<div class="legend-item"><div class="legend-color" style="background: #8a8a8a;"></div><div class="legend-text">Recent (2010s)</div></div>';
            html += '<div class="legend-item"><div class="legend-color" style="background: #c0c0c0;"></div><div class="legend-text">Future (2030s+)</div></div>';
            legend.innerHTML = html;
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (hoveredNode && hoveredNode !== selectedNode) {
                hoveredNode.material.emissiveIntensity = 0.2;
            }

            if (intersects.length > 0) {
                hoveredNode = intersects[0].object;
                if (hoveredNode !== selectedNode) {
                    hoveredNode.material.emissiveIntensity = 0.6;
                }
                showTooltip(event, hoveredNode);
            } else {
                hoveredNode = null;
                document.getElementById('tooltip').style.display = 'none';
            }
        }

        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (intersects.length > 0) {
                selectedNode = intersects[0].object;
                const details = nodeDetails.get(selectedNode.userData.id);
                showSidebar(details);
            }
        }

        function showTooltip(event, node) {
            const details = nodeDetails.get(node.userData.id);
            document.getElementById('tooltipTitle').textContent = details.title;
            document.getElementById('tooltipText').innerHTML = `
                <strong>Category:</strong> ${details.category}<br>
                <strong>Year:</strong> ${details.year}<br>
                <strong>Relationships:</strong> ${details.relationships}
            `;

            const tooltip = document.getElementById('tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = (event.clientX + 10) + 'px';
            tooltip.style.top = (event.clientY + 10) + 'px';
        }

        function showSidebar(details) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebarContent');

            let html = `<div class="node-title">${details.title}</div>`;
            html += `<div class="node-detail"><div class="detail-label">Category</div><div class="detail-value">${details.category}</div></div>`;
            html += `<div class="node-detail"><div class="detail-label">Year</div><div class="detail-value">${details.year}</div></div>`;
            html += `<div class="node-detail"><div class="detail-label">Criticality</div><div class="detail-value"><span class="detail-tag">${details.criticality.toUpperCase()}</span></div></div>`;
            html += `<div class="node-detail"><div class="detail-label">Impact</div><div class="detail-value">Relationships: ${details.relationships}<br>Links: ${details.linksFound}<br>Text: ${(details.textLength / 1000).toFixed(1)}k chars</div></div>`;

            if (details.applications && details.applications.length > 0) {
                html += `<div class="node-detail"><div class="detail-label">Applications</div><div class="detail-value">`;
                details.applications.slice(0, 3).forEach(app => {
                    html += `<div style="margin-bottom: 6px; font-size: 11px;">• ${app}</div>`;
                });
                html += `</div></div>`;
            }

            if (details.convergence && details.convergence.length > 0) {
                html += `<div class="node-detail"><div class="detail-label">Convergence</div><div class="detail-value">`;
                details.convergence.slice(0, 3).forEach(field => {
                    html += `<span class="detail-tag">${field}</span>`;
                });
                html += `</div></div>`;
            }

            html += `<div class="node-detail"><div class="detail-label">Description</div><div class="detail-value">${details.description}</div></div>`;

            content.innerHTML = html;
            sidebar.classList.add('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        loadData();
    </script>
</body>
</html>
