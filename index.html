<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotics Innovation Timeline</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    color: #e8e8e8;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(212,175,55,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  #network {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* ── Legend ── */
  #legend {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 50;
    background: rgba(13,13,13,0.92);
    border: 1px solid #2d2d2d;
    border-radius: 10px;
    padding: 16px 18px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    min-width: 190px;
  }
  #legend h2 {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #d4af37;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .leg { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .leg-dot {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15);
  }
  .leg span { font-size: 11px; color: #a8a8a8; }
  #legend hr { border: none; border-top: 1px solid #2d2d2d; margin: 10px 0; }
  #legend p { font-size: 10px; color: #5a5a5a; font-style: italic; }

  /* ── Side Panel ── */
  #panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 360px;
    z-index: 100;
    background: linear-gradient(180deg, #111 0%, #1a1a1a 100%);
    border-left: 1px solid #2d2d2d;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 32px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  #panel.open { transform: translateX(0); }

  #panel-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid #2d2d2d;
    background: rgba(212,175,55,0.04);
    flex-shrink: 0;
  }
  #panel-title {
    font-size: 16px;
    font-weight: 700;
    color: #f5f5f5;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  #panel-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.4);
    color: #d4af37;
    background: rgba(212,175,55,0.08);
  }
  #close-btn {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: none;
    color: #5a5a5a;
    font-size: 22px;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
  }
  #close-btn:hover { color: #d4af37; }

  #panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  #panel-body::-webkit-scrollbar { width: 5px; }
  #panel-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  #panel-body::-webkit-scrollbar-thumb { background: #2d2d2d; border-radius: 3px; }

  .section {
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(212,175,55,0.07);
  }
  .section:last-child { border-bottom: none; margin-bottom: 0; }
  .section-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 8px;
  }
  .section p { font-size: 12px; line-height: 1.6; color: #a8a8a8; }
  .section ul { list-style: none; }
  .section ul li {
    font-size: 12px;
    color: #a8a8a8;
    padding: 4px 0 4px 14px;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .section ul li:last-child { border-bottom: none; }
  .section ul li::before { content: "▸"; position: absolute; left: 0; color: #d4af37; font-size: 10px; top: 5px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px; }
  .meta-item {
    background: #1a1a1a;
    border: 1px solid #2d2d2d;
    border-radius: 6px;
    padding: 6px 8px;
  }
  .meta-label { font-size: 9px; color: #5a5a5a; text-transform: uppercase; letter-spacing: 1px; }
  .meta-value { font-size: 11px; color: #c9a961; font-weight: 600; margin-top: 2px; }

  /* ── Loading ── */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 44px; height: 44px;
    border: 2px solid #2d2d2d;
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: #5a5a5a; letter-spacing: 1px; }

  /* ── Instructions ── */
  #hint {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 50;
    font-size: 10px;
    color: #3a3a3a;
    pointer-events: none;
  }
</style>
</head>

// Color map
const COLORS = {
  robotics:    { bg: "#d4af37", border: "#ffffff", hover: "#ffe080", highlight: "#ffe080" },
  emerging:    { bg: "#c9a961", border: "#d4af37", hover: "#e8c97a", highlight: "#e8c97a" },
  established: { bg: "#4a7c7e", border: "#6aacae", hover: "#5a9c9e", highlight: "#5a9c9e" },
};

// Build vis DataSets
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id,
  label: n.label,
  title: n.title,
  x: n.x,
  size: n.size,
  color: {
    background: COLORS[n.group].bg,
    border: COLORS[n.group].border,
    hover:     { background: COLORS[n.group].hover,     border: "#ffffff" },
    highlight: { background: COLORS[n.group].highlight, border: "#ffffff" }
  },
  font: {
    color: "#e8e8e8",
    size: n.group === "robotics" ? 18 : n.group === "emerging" ? 13 : 11,
    face: "Arial",
    strokeWidth: 3,
    strokeColor: "#0d0d0d"
  },
  shape: "dot",
  borderWidth: n.group === "robotics" ? 3 : 1.5,
  borderWidthSelected: 4,
  shadow: { enabled: true, color: "rgba(0,0,0,0.7)", size: 12, x: 3, y: 3 },
  // store metadata
  _data: n
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i,
  from: e.from,
  to: e.to,
  dashes: e.dashes,
  width: e.width,
  color: {
    color: e.dashes ? "#2a2a2a" : "#404040",
    highlight: "#d4af37",
    hover: "#d4af37",
    opacity: e.dashes ? 0.5 : 0.7
  },
  smooth: { enabled: true, type: "dynamic" },
  arrows: { to: { enabled: true, scaleFactor: 0.4, type: "arrow" } },
  selectionWidth: 3,
  hoverWidth: 2
})));

// Network options
const options = {
  nodes: { physics: true },
  edges: {
    smooth: { enabled: true, type: "dynamic" },
    scaling: { min: 1, max: 4 }
  },
  physics: {
    enabled: true,
    solver: "barnesHut",
    barnesHut: {
      gravitationalConstant: -8000,
      centralGravity: 0.2,
      springLength: 200,
      springConstant: 0.04,
      damping: 0.09,
      avoidOverlap: 0.5
    },
    stabilization: {
      enabled: true,
      iterations: 500,
      updateInterval: 25,
      fit: true
    }
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    multiselect: false,
    selectConnectedEdges: true,
    zoomView: true,
    navigationButtons: false,
    keyboard: { enabled: true }
  },
  layout: {
    improvedLayout: false
  }
};

// Init network
const container = document.getElementById("network");
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, options);

// Hide loading once stabilized
network.on("stabilizationProgress", function(params) {
  const pct = Math.round(params.iterations / params.total * 100);
  document.querySelector("#loading p").textContent = "BUILDING GRAPH... " + pct + "%";
});
network.on("stabilizationIterationsDone", function() {
  document.getElementById("loading").classList.add("hidden");
  network.fit({ animation: { duration: 800, easingFunction: "easeInOutQuad" } });
});

// Click node → open panel
network.on("click", function(params) {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    const node = nodesDS.get(nodeId);
    openPanel(node._data);

    // Highlight connected edges
    highlightConnections(nodeId);
  } else {
    closePanel();
    network.unselectAll();
    resetHighlight();
  }
});

// Hover cursor
network.on("hoverNode", function() {
  container.style.cursor = "pointer";
});
network.on("blurNode", function() {
  container.style.cursor = "grab";
});

// Drag cursor
network.on("dragStart", function() {
  container.style.cursor = "grabbing";
});
network.on("dragEnd", function() {
  container.style.cursor = "grab";
});

// ── Highlight connected nodes/edges ──
function highlightConnections(selectedId) {
  const connectedNodes = network.getConnectedNodes(selectedId);
  const connectedEdges = network.getConnectedEdges(selectedId);
  const allNodeIds = nodesDS.getIds();
  const allEdgeIds = edgesDS.getIds();

  // Fade all nodes/edges, brighten connected ones
  const nodeUpdates = allNodeIds.map(id => {
    const n = nodesDS.get(id);
    const isSelected = id === selectedId;
    const isConnected = connectedNodes.indexOf(id) !== -1;
    return {
      id,
      color: isSelected || isConnected
        ? {
            background: COLORS[n._data.group].highlight,
            border: isSelected ? "#ffffff" : COLORS[n._data.group].border,
            hover: { background: COLORS[n._data.group].hover, border: "#ffffff" },
            highlight: { background: COLORS[n._data.group].highlight, border: "#ffffff" }
          }
        : {
            background: COLORS[n._data.group].bg + "44",
            border: COLORS[n._data.group].border + "44",
            hover: { background: COLORS[n._data.group].hover + "44", border: "#ffffff44" },
            highlight: { background: COLORS[n._data.group].highlight, border: "#ffffff" }
          },
      font: { color: isSelected || isConnected ? "#e8e8e8" : "#e8e8e822" }
    };
  });

  const edgeUpdates = allEdgeIds.map(id => {
    const isConn = connectedEdges.indexOf(id) !== -1;
    return {
      id,
      color: isConn
        ? { color: "#d4af37", highlight: "#d4af37", hover: "#d4af37", opacity: 1.0 }
        : { color: "#ffffff08", highlight: "#d4af37", hover: "#d4af37", opacity: 0.1 }
    };
  });

  nodesDS.update(nodeUpdates);
  edgesDS.update(edgeUpdates);
}

function resetHighlight() {
  const nodeUpdates = nodesDS.getIds().map(id => {
    const n = nodesDS.get(id);
    return {
      id,
      color: {
        background: COLORS[n._data.group].bg,
        border: COLORS[n._data.group].border,
        hover: { background: COLORS[n._data.group].hover, border: "#ffffff" },
        highlight: { background: COLORS[n._data.group].highlight, border: "#ffffff" }
      },
      font: { color: "#e8e8e8" }
    };
  });

  const edgeUpdates = edgesDS.getIds().map(id => {
    const e = edgesDS.get(id);
    return {
      id,
      color: {
        color: e.dashes ? "#2a2a2a" : "#404040",
        highlight: "#d4af37",
        hover: "#d4af37",
        opacity: e.dashes ? 0.5 : 0.7
      }
    };
  });

  nodesDS.update(nodeUpdates);
  edgesDS.update(edgeUpdates);
}

// ── Side Panel ──
function openPanel(d) {
  document.getElementById("panel-title").textContent = d._full_title;
  document.getElementById("panel-badge").textContent =
    d.group === "robotics" ? "Core Robotics" :
    d.group === "emerging" ? "Emerging Technology" : "Established Innovation";

  let html = "";

  // Meta grid
  html += `<div class="section">
    <div class="section-title">Overview</div>
    <div class="meta-grid">
      <div class="meta-item"><div class="meta-label">Timeline</div><div class="meta-value">${d._years}</div></div>
      <div class="meta-item"><div class="meta-label">Maturation</div><div class="meta-value">${d._maturation}</div></div>
      <div class="meta-item"><div class="meta-label">Criticality</div><div class="meta-value">${d._criticality}</div></div>
      <div class="meta-item"><div class="meta-label">Category</div><div class="meta-value">${d.group.charAt(0).toUpperCase()+d.group.slice(1)}</div></div>
    </div>
  </div>`;

  if (d._predecessors && d._predecessors.length) {
    html += `<div class="section"><div class="section-title">▸ Built On (Predecessors)</div><ul>`;
    d._predecessors.forEach(p => { html += `<li>${p}</li>`; });
    html += `</ul></div>`;
  }

  if (d._applications && d._applications.length) {
    html += `<div class="section"><div class="section-title">▸ Future Applications</div><ul>`;
    d._applications.forEach(a => { html += `<li>${a}</li>`; });
    html += `</ul></div>`;
  }

  if (d._convergence && d._convergence.length) {
    html += `<div class="section"><div class="section-title">▸ Converges With</div><ul>`;
    d._convergence.forEach(c => { html += `<li>${c}</li>`; });
    html += `</ul></div>`;
  }

  if (d._future_impact) {
    html += `<div class="section"><div class="section-title">▸ Future Impact</div><p>${d._future_impact}...</p></div>`;
  }

  if (d._problems_solved && d._problems_solved.length) {
    html += `<div class="section"><div class="section-title">▸ Problems Solved</div><ul>`;
    d._problems_solved.forEach(p => { html += `<li>${p}</li>`; });
    html += `</ul></div>`;
  }

  if (d._downstream) {
    html += `<div class="section"><div class="section-title">▸ Downstream Impact</div><p>${d._downstream}</p></div>`;
  }

  document.getElementById("panel-body").innerHTML = html;
  document.getElementById("panel").classList.add("open");
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  resetHighlight();
}

document.getElementById("close-btn").addEventListener("click", closePanel);

// Keyboard: Escape closes panel
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePanel();
});
</script>
