<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotics Innovation Graph</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root{
      --bg:#0b0d10; --panel:#10141a; --panel2:#151b22; --text:#eef2f6; --muted:#97a3af;
      --existing:#b9c0ca; --emerging:#d7a94b; --category:#7f8cff; --accent:#d4af37;
      --shadow:0 12px 36px rgba(0,0,0,.45);
    }
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at top,#141922 0%,#0b0d10 62%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    #app{display:flex;width:100vw;height:100vh;}
    #graph-wrap{flex:1;position:relative;overflow:hidden;}
    #sidebar{width:380px;min-width:320px;max-width:440px;background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);border-left:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);padding:18px;overflow-y:auto;}
    #sidebar h2{margin:0 0 8px;font-size:20px;}
    #sidebar .sub{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5;}
    .meta-section{margin-bottom:18px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;}
    .meta-section h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#cfd6df;}
    .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px;line-height:1.45;}
    .k{color:var(--muted);}
    .v{color:var(--text);white-space:pre-wrap;}
    #tooltip{position:absolute;pointer-events:none;opacity:0;background:rgba(8,10,13,.96);color:white;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;max-width:360px;font-size:13px;line-height:1.45;box-shadow:var(--shadow);transform:translate(12px,12px);z-index:10;}
    #legend{position:absolute;left:18px;top:18px;background:rgba(10,12,15,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:5;font-size:13px;}
    .legend-row{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);}
    .swatch{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.25);}
    #hint{margin-top:10px;font-size:12px;color:var(--muted);max-width:300px;line-height:1.4;}
    svg{width:100%;height:100%;display:block;}
    .cluster-band{fill:rgba(255,255,255,.02);stroke:rgba(255,255,255,.06);stroke-width:1;}
    .cluster-label{font-size:12px;fill:rgba(255,255,255,.35);letter-spacing:.06em;text-transform:uppercase;pointer-events:none;}
    .gridline{stroke:rgba(255,255,255,.06);stroke-width:1;}
    .axis-label{fill:rgba(255,255,255,.30);font-size:11px;}
    .link{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.25;opacity:.85;stroke-linecap:round;}
    .link.highlight{stroke:#ffffff;stroke-width:2.6;opacity:1;}
    .link.dim{opacity:.08;}
    .node{cursor:pointer;}
    .node circle{stroke:rgba(255,255,255,.35);stroke-width:1.2;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));}
    .node text{fill:var(--text);font-size:12px;pointer-events:none;paint-order:stroke;stroke:rgba(11,13,16,.9);stroke-width:4px;stroke-linejoin:round;}
    .node.highlight circle{stroke:#ffffff;stroke-width:2.2;}
    .node.selected circle{stroke:var(--accent);stroke-width:2.8;}
    .node.dim{opacity:.14;}
  </style>
</head>
<body>
<div id="app">
  <div id="graph-wrap">
    <button class="top-btn" onclick="window.location.href='robotics_emergent_list.html'">
  Emergent list
</button>
    <div id="legend">
      <div style="font-weight:600;color:#fff;">Robotics Evolution</div>
      <div class="legend-row"><span class="swatch" style="background:var(--existing)"></span> Existing innovation</div>
      <div class="legend-row"><span class="swatch" style="background:var(--emerging)"></span> Emerging technology</div>
      <div class="legend-row"><span class="swatch" style="background:var(--category)"></span> Robotics category</div>
      <div id="hint">Click a node to highlight ancestors and descendants. Hover for description. Scroll to zoom.</div>
    </div>
    <div id="tooltip"></div>
    <svg id="svg"></svg>
  </div>
  <aside id="sidebar">
    <h2 id="panel-title">Select a node</h2>
    <div class="sub" id="panel-sub">Metadata will appear here.</div>
    <div id="panel-content"></div>
  </aside>
</div>

const svg = d3.select("#svg");
const wrap = document.getElementById("graph-wrap");
const tooltip = document.getElementById("tooltip");
const sidebarTitle = document.getElementById("panel-title");
const sidebarSub = document.getElementById("panel-sub");
const sidebarContent = document.getElementById("panel-content");

const gRoot = svg.append("g");
const gBands = gRoot.append("g");
const gGrid = gRoot.append("g");
const gLinks = gRoot.append("g");
const gNodes = gRoot.append("g");
const gLabels = gRoot.append("g");

svg.call(
  d3.zoom()
    .scaleExtent([0.35, 2.5])
    .on("zoom", event => gRoot.attr("transform", event.transform))
);

let nodeById = new Map(NODES.map(d => [d.id, d]));
let selectedId = null;

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

function updateSidebar(d){
  sidebarTitle.textContent = d.label;
  sidebarSub.textContent = `${d.cluster} • ${d.yearSort}`;
  sidebarContent.innerHTML = `
    <div class="meta-section"><h3>Description</h3><div class="v">${escapeHtml(d.description || "")}</div></div>
    <div class="meta-section"><h3>Metadata</h3><div class="kv">
      ${Object.entries(d).map(([k,v]) => `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v === null ? "null" : String(v))}</div>`).join("")}
    </div></div>`;
}

function render(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const margin = { top: 90, right: 40, bottom: 55, left: 40 };
  const innerW = Math.max(400, w - margin.left - margin.right);
  const innerH = Math.max(300, h - margin.top - margin.bottom);

  svg.attr("viewBox", [0,0,w,h]);
  gRoot.attr("transform", `translate(${margin.left},${margin.top})`);

  const xScale = d3.scaleLinear().domain(d3.extent(NODES, d => d.yearSort)).range([90, innerW - 100]);
  const clusters = Array.from(d3.group(NODES, d => d.cluster), ([key, vals]) => ({ key, vals }));
  const yScale = d3.scaleBand().domain(clusters.map(d => d.key)).range([20, innerH - 30]).padding(0.28);

  NODES.forEach(n => { n.x = xScale(n.yearSort); n.y = yScale(n.cluster) + yScale.bandwidth()/2; });

  gBands.selectAll("*").remove();
  gGrid.selectAll("*").remove();
  gLinks.selectAll("*").remove();
  gNodes.selectAll("*").remove();
  gLabels.selectAll("*").remove();

  gBands.selectAll("rect").data(clusters).enter().append("rect")
    .attr("class","cluster-band")
    .attr("x",0)
    .attr("y",d => yScale(d.key)-12)
    .attr("width",innerW)
    .attr("height",yScale.bandwidth()+24)
    .attr("rx",16)
    .attr("ry",16);

  gLabels.selectAll("text").data(clusters).enter().append("text")
    .attr("class","cluster-label")
    .attr("x",10)
    .attr("y",d => yScale(d.key)-16)
    .text(d => d.key);

  const ticks = xScale.ticks(8);
  gGrid.selectAll("line").data(ticks).enter().append("line")
    .attr("class","gridline")
    .attr("x1",d => xScale(d))
    .attr("x2",d => xScale(d))
    .attr("y1",-8)
    .attr("y2",innerH+10);

  gGrid.selectAll("text").data(ticks).enter().append("text")
    .attr("class","axis-label")
    .attr("x",d => xScale(d))
    .attr("y",innerH+32)
    .attr("text-anchor","middle")
    .text(d => d);

  const curve = d => {
    const s = nodeById.get(d.source);
    const t = nodeById.get(d.target);
    if (!s || !t) return "";
    const dx = Math.max(22, Math.abs(t.x - s.x) * 0.45);
    return `M${s.x},${s.y} C${s.x + dx},${s.y} ${t.x - dx},${t.y} ${t.x},${t.y}`;
  };

  const linkSel = gLinks.selectAll("path").data(LINKS).enter().append("path")
    .attr("class","link")
    .attr("d",curve);

  const nodeSel = gNodes.selectAll("g").data(NODES).enter().append("g")
    .attr("class","node")
    .attr("transform",d => `translate(${d.x},${d.y})`)
    .on("mousemove",(event,d) => {
      tooltip.style.opacity = 1;
      tooltip.style.left = event.offsetX + "px";
      tooltip.style.top = event.offsetY + "px";
      tooltip.innerHTML = `<strong>${escapeHtml(d.label)}</strong><br>${escapeHtml(d.description || "")}`;
    })
    .on("mouseleave",() => { tooltip.style.opacity = 0; })
    .on("click",(event,d) => {
      event.stopPropagation();
      selectedId = d.id;
      updateHighlights();
      updateSidebar(d);
    });

  nodeSel.append("circle")
    .attr("r", d => 9 + Math.min(10, (LINKS.filter(l => l.source === d.id || l.target === d.id).length) * 0.7))
    .attr("fill", d => d.node_type === "category"
      ? getComputedStyle(document.documentElement).getPropertyValue("--category").trim()
      : d.yearSort >= 2020
        ? getComputedStyle(document.documentElement).getPropertyValue("--emerging").trim()
        : getComputedStyle(document.documentElement).getPropertyValue("--existing").trim());

  nodeSel.append("text")
    .attr("x",12)
    .attr("y",4)
    .text(d => d.label);

  function updateHighlights(){
    const selected = selectedId ? nodeById.get(selectedId) : null;
    const active = new Set([selectedId]);

    if (selected) {
      LINKS.forEach(l => {
        if (l.source === selected.id) active.add(l.target);
        if (l.target === selected.id) active.add(l.source);
      });
    }

    nodeSel.classed("highlight", d => selected && active.has(d.id))
      .classed("selected", d => selected && d.id === selected.id)
      .classed("dim", d => selected && !active.has(d.id));

    linkSel.classed("highlight", d => selected && (d.source === selected.id || d.target === selected.id))
      .classed("dim", d => selected && !(d.source === selected.id || d.target === selected.id));
  }

  updateHighlights();

  svg.on("click", () => {
    selectedId = null;
    sidebarTitle.textContent = "Select a node";
    sidebarSub.textContent = "Metadata will appear here.";
    sidebarContent.innerHTML = "";
    updateHighlights();
  });
}

render();
</script>
</body>
</html>
