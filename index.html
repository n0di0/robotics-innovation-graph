<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotics Innovation Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151b;
      --panel-2: #151b22;
      --text: #eef2f6;
      --muted: #9aa5b1;
      --line: #2a313b;
      --node: #d6dbe3;
      --existing: #b9c0ca;
      --emerging: #d7a94b;
      --category: #7f8cff;
      --accent: #d4af37;
      --highlight: #ffffff;
      --dim: rgba(255,255,255,0.12);
      --shadow: 0 12px 36px rgba(0,0,0,0.45);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #131821 0%, #0b0d10 60%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #graph-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #sidebar {
      width: 360px;
      min-width: 320px;
      max-width: 420px;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border-left: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
      padding: 20px 18px;
      overflow-y: auto;
    }

    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    #sidebar .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .meta-section {
      margin-bottom: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
    }

    .meta-section h3 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cfd6df;
    }

    .kv {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .k {
      color: var(--muted);
    }

    .v {
      color: var(--text);
      word-break: break-word;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: rgba(8,10,13,0.96);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 12px;
      max-width: 340px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: var(--shadow);
      transform: translate(12px, 12px);
      z-index: 10;
    }

    #legend {
      position: absolute;
      left: 18px;
      top: 18px;
      background: rgba(10,12,15,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      z-index: 5;
      font-size: 13px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      color: var(--muted);
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
    }

    #hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      max-width: 280px;
      line-height: 1.4;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cluster-label {
      font-size: 12px;
      fill: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .cluster-band {
      fill: rgba(255,255,255,0.02);
      stroke: rgba(255,255,255,0.06);
      stroke-width: 1;
    }

    .link {
      fill: none;
      stroke: rgba(255,255,255,0.2);
      stroke-width: 1.2;
      stroke-linecap: round;
      opacity: 0.85;
    }

    .link.highlight {
      stroke: #ffffff;
      stroke-width: 2.6;
      opacity: 1;
    }

    .link.dim {
      opacity: 0.08;
    }

    .node circle {
      stroke: rgba(255,255,255,0.35);
      stroke-width: 1.2;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
    }

    .node text {
      fill: var(--text);
      font-size: 12px;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(11,13,16,0.85);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .node.dim {
      opacity: 0.15;
    }

    .node.highlight circle {
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .node.selected circle {
      stroke: var(--accent);
      stroke-width: 2.8;
    }

    .gridline {
      stroke: rgba(255,255,255,0.06);
      stroke-width: 1;
    }

    .axis-label {
      fill: rgba(255,255,255,0.3);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="graph-wrap">
      <div id="legend">
        <div style="font-weight:600; color:#fff;">Robotics Evolution</div>
        <div class="legend-row"><span class="swatch" style="background: var(--existing);"></span> Existing innovation</div>
        <div class="legend-row"><span class="swatch" style="background: var(--emerging);"></span> Emerging technology</div>
        <div class="legend-row"><span class="swatch" style="background: var(--category);"></span> Robotics category</div>
        <div id="hint">Click a node to reveal all ancestor and descendant paths. Hover for description. Drag nodes slightly if needed; scroll to zoom.</div>
      </div>
      <div id="tooltip"></div>
      <svg id="svg"></svg>
    </div>
    <aside id="sidebar">
      <h2 id="panel-title">Select a node</h2>
      <div class="sub" id="panel-sub">Metadata will appear here.</div>
      <div id="panel-content"></div>
    </aside>
  </div>

  <script>
    const svg = d3.select("#svg");
    const wrap = document.querySelector("#graph-wrap");
    const tooltip = document.getElementById("tooltip");
    const sidebarTitle = document.getElementById("panel-title");
    const sidebarSub = document.getElementById("panel-sub");
    const sidebarContent = document.getElementById("panel-content");

    const width = () => wrap.clientWidth;
    const height = () => wrap.clientHeight;

    const gRoot = svg.append("g");
    const gLinks = gRoot.append("g").attr("class", "links");
    const gBands = gRoot.append("g").attr("class", "bands");
    const gNodes = gRoot.append("g").attr("class", "nodes");
    const gLabels = gRoot.append("g").attr("class", "labels");

    const zoom = d3.zoom()
      .scaleExtent([0.35, 2.5])
      .on("zoom", (event) => gRoot.attr("transform", event.transform));

    svg.call(zoom);

    let graphData = null;
    let nodes = [];
    let links = [];
    let nodeById = new Map();
    let selectedId = null;

    const colorFor = d => {
      const type = (d.node_type || d.type || d.category_type || "").toLowerCase();
      const emerging = String(d.stage || d.status || d.temporal_state || "").toLowerCase().includes("emerg");
      const category = String(d.category || d.kind || "").toLowerCase().includes("category");
      if (category) return getComputedStyle(document.documentElement).getPropertyValue("--category").trim();
      if (emerging || type.includes("emerg")) return getComputedStyle(document.documentElement).getPropertyValue("--emerging").trim();
      return getComputedStyle(document.documentElement).getPropertyValue("--existing").trim();
    };

    const getLabel = d => d.name || d.title || d.label || d.id || "Untitled";
    const getDescription = d => d.description || d.desc || d.summary || "No description available.";
    const getYearValue = d => {
      const candidates = [d.year, d.date, d.start_year, d.end_year, d.timestamp, d.period_start, d.period_end];
      for (const c of candidates) {
        if (typeof c === "number" && isFinite(c)) return c;
        if (typeof c === "string") {
          const m = c.match(/(\d{4})/);
          if (m) return +m[1];
        }
      }
      return 9999;
    };

    function normalize(raw) {
      let n = [];
      let l = [];

      if (Array.isArray(raw)) {
        if (raw.length && raw[0].source && raw[0].target) {
          const ids = new Set();
          raw.forEach(e => { ids.add(e.source); ids.add(e.target); });
          n = Array.from(ids).map(id => ({ id }));
          l = raw.map(e => ({ source: e.source, target: e.target, ...e }));
        } else {
          n = raw;
          l = [];
        }
      } else if (raw && typeof raw === "object") {
        n = raw.nodes || raw.items || raw.entities || raw.data || [];
        l = raw.links || raw.edges || raw.relationships || raw.connections || [];
        if ((!n || !n.length) && raw.graph) {
          n = raw.graph.nodes || [];
          l = raw.graph.links || raw.graph.edges || [];
        }
      }

      n = n.map((d, i) => ({
        ...d,
        id: d.id || d._id || d.key || `node-${i}`,
        label: getLabel(d),
        description: getDescription(d),
        yearSort: getYearValue(d)
      }));

      l = l.map((d, i) => ({
        ...d,
        id: d.id || `link-${i}`,
        source: d.source,
        target: d.target,
        relationship: d.relationship || d.type || d.label || ""
      }));

      return { nodes: n, links: l };
    }

    function deriveHierarchies(nodes, links) {
      const incoming = new Map(nodes.map(n => [n.id, []]));
      const outgoing = new Map(nodes.map(n => [n.id, []]));
      links.forEach(l => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        if (incoming.has(t)) incoming.get(t).push(s);
        if (outgoing.has(s)) outgoing.get(s).push(t);
      });

      function ancestors(id, seen = new Set()) {
        const out = new Set();
        for (const p of incoming.get(id) || []) {
          if (!seen.has(p)) {
            seen.add(p);
            out.add(p);
            ancestors(p, seen).forEach(v => out.add(v));
          }
        }
        return out;
      }

      function descendants(id, seen = new Set()) {
        const out = new Set();
        for (const c of outgoing.get(id) || []) {
          if (!seen.has(c)) {
            seen.add(c);
            out.add(c);
            descendants(c, seen).forEach(v => out.add(v));
          }
        }
        return out;
      }

      return { incoming, outgoing, ancestors, descendants };
    }

    function clusterKey(d) {
      return d.cluster || d.group || d.category || d.domain || d.field || "Other";
    }

    function render(raw) {
      const normalized = normalize(raw);
      nodes = normalized.nodes;
      links = normalized.links;
      nodeById = new Map(nodes.map(d => [d.id, d]));
      const { incoming, outgoing, ancestors, descendants } = deriveHierarchies(nodes, links);

      nodes.sort((a, b) => d3.ascending(a.yearSort, b.yearSort) || d3.ascending(getLabel(a), getLabel(b)));

      const margin = { top: 88, right: 40, bottom: 60, left: 40 };
      const innerW = width() - margin.left - margin.right;
      const innerH = height() - margin.top - margin.bottom;

      svg.attr("viewBox", [0, 0, width(), height()]);
      gRoot.attr("transform", `translate(${margin.left},${margin.top})`);

      const xScale = d3.scaleLinear()
        .domain(d3.extent(nodes, d => d.yearSort))
        .range([90, Math.max(110, innerW - 120)]);

      const clusters = Array.from(d3.group(nodes, clusterKey), ([key, vals]) => ({ key, vals }));
      const color = d3.scaleOrdinal()
        .domain(clusters.map(d => d.key))
        .range(d3.schemeTableau10.concat(["#9b7cff", "#6bc1ff", "#ffd166"]));

      clusters.forEach(c => {
        c.minX = d3.min(c.vals, d => xScale(d.yearSort));
        c.maxX = d3.max(c.vals, d => xScale(d.yearSort));
      });

      const yPerCluster = d3.scaleBand()
        .domain(clusters.map(d => d.key))
        .range([20, innerH - 30])
        .padding(0.28);

      nodes.forEach(n => {
        const cluster = clusterKey(n);
        n.fx = xScale(n.yearSort) + (Math.random() - 0.5) * 14;
        n.fy = yPerCluster(cluster) + yPerCluster.bandwidth() / 2;
        n.cluster = cluster;
      });

      const sim = d3.forceSimulation(nodes)
        .force("x", d3.forceX(d => xScale(d.yearSort)).strength(0.9))
        .force("y", d3.forceY(d => yPerCluster(d.cluster) + yPerCluster.bandwidth()/2).strength(0.8))
        .force("collide", d3.forceCollide(18))
        .force("charge", d3.forceManyBody().strength(-14))
        .force("link", d3.forceLink(links).id(d => d.id).distance(65).strength(0.15))
        .stop();

      for (let i = 0; i < 260; i++) sim.tick();

      gBands.selectAll("*").remove();
      gLabels.selectAll("*").remove();
      gLinks.selectAll("*").remove();
      gNodes.selectAll("*").remove();

      const bands = gBands.selectAll(".cluster-band")
        .data(clusters)
        .enter()
        .append("rect")
        .attr("class", "cluster-band")
        .attr("x", 0)
        .attr("y", d => yPerCluster(d.key) - 12)
        .attr("width", innerW)
        .attr("height", yPerCluster.bandwidth() + 24)
        .attr("rx", 16)
        .attr("ry", 16);

      gLabels.selectAll(".cluster-label")
        .data(clusters)
        .enter()
        .append("text")
        .attr("class", "cluster-label")
        .attr("x", 10)
        .attr("y", d => yPerCluster(d.key) - 16)
        .text(d => d.key);

      const gridYears = xScale.ticks(Math.min(12, nodes.length));
      gRoot.append("g").selectAll(".gridline")
        .data(gridYears)
        .enter()
        .append("line")
        .attr("class", "gridline")
        .attr("x1", d => xScale(d))
        .attr("x2", d => xScale(d))
        .attr("y1", -8)
        .attr("y2", innerH + 10);

      gRoot.append("g").selectAll(".axis-label")
        .data(gridYears)
        .enter()
        .append("text")
        .attr("class", "axis-label")
        .attr("x", d => xScale(d))
        .attr("y", innerH + 32)
        .attr("text-anchor", "middle")
        .text(d => d);

      const linkSel = gLinks.selectAll(".link")
        .data(links)
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d => {
          const s = typeof d.source === "object" ? d.source : nodeById.get(d.source);
          const t = typeof d.target === "object" ? d.target : nodeById.get(d.target);
          if (!s || !t) return "";
          const dx = Math.max(20, Math.abs(t.x - s.x) * 0.5);
          return `M${s.x},${s.y} C${s.x + dx},${s.y} ${t.x - dx},${t.y} ${t.x},${t.y}`;
        });

      const nodeSel = gNodes.selectAll(".node")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .style("cursor", "pointer")
        .on("mousemove", (event, d) => {
          tooltip.style.opacity = 1;
          tooltip.style.left = event.offsetX + "px";
          tooltip.style.top = event.offsetY + "px";
          tooltip.innerHTML = `<strong>${d.label}</strong><br>${d.description}`;
        })
        .on("mouseleave", () => {
          tooltip.style.opacity = 0;
        })
        .on("click", (event, d) => {
          event.stopPropagation();
          selectedId = d.id;
          updateHighlights();
          updateSidebar(d);
        })
        .call(d3.drag()
          .on("start", (event, d) => {
            if (!event.active) sim.alphaTarget(0.2).restart();
            d.fx = d.x;
            d.fy = d.y;
          })
          .on("drag", (event, d) => {
            d.fx = event.x;
            d.fy = event.y;
            d.x = event.x;
            d.y = event.y;
            nodeSel.attr("transform", n => `translate(${n.x},${n.y})`);
            linkSel.attr("d", l => {
              const s = typeof l.source === "object" ? l.source : nodeById.get(l.source);
              const t = typeof l.target === "object" ? l.target : nodeById.get(l.target);
              if (!s || !t) return "";
              const dx = Math.max(20, Math.abs(t.x - s.x) * 0.5);
              return `M${s.x},${s.y} C${s.x + dx},${s.y} ${t.x - dx},${t.y} ${t.x},${t.y}`;
            });
          })
          .on("end", (event, d) => {
            if (!event.active) sim.alphaTarget(0);
            d.fx = null;
            d.fy = null;
          }));

      nodeSel.append("circle")
        .attr("r", d => {
          const degree = (incoming.get(d.id)?.length || 0) + (outgoing.get(d.id)?.length || 0);
          return 7.5 + Math.min(9, degree * 0.65);
        })
        .attr("fill", d => colorFor(d));

      nodeSel.append("text")
        .attr("x", 12)
        .attr("y", 4)
        .text(d => d.label);

      function updateHighlights() {
        const selected = selectedId ? nodeById.get(selectedId) : null;
        const ancestorSet = selected ? ancestors(selected.id) : new Set();
        const descendantSet = selected ? descendants(selected.id) : new Set();
        const pathSet = new Set([selectedId, ...ancestorSet, ...descendantSet].filter(Boolean));

        nodeSel.classed("highlight", d => selected && pathSet.has(d.id))
          .classed("selected", d => selected && d.id === selected.id)
          .classed("dim", d => selected && !pathSet.has(d.id));

        linkSel.classed("highlight", d => {
          if (!selected) return false;
          const s = typeof d.source === "object" ? d.source.id : d.source;
          const t = typeof d.target === "object" ? d.target.id : d.target;
          return (ancestorSet.has(s) && pathSet.has(t)) || (pathSet.has(s) && descendantSet.has(t)) || (s === selected.id || t === selected.id);
        }).classed("dim", d => {
          if (!selected) return false;
          const s = typeof d.source === "object" ? d.source.id : d.source;
          const t = typeof d.target === "object" ? d.target.id : d.target;
          return !((ancestorSet.has(s) && pathSet.has(t)) || (pathSet.has(s) && descendantSet.has(t)) || (s === selected.id || t === selected.id));
        });
      }

      function updateSidebar(d) {
        sidebarTitle.textContent = d.label;
        sidebarSub.textContent = `${d.cluster || "Unclustered"} • ${d.yearSort === 9999 ? "Date unknown" : d.yearSort}`;
        const entries = Object.entries(d).filter(([k, v]) => {
          if (["x","y","vx","vy","fx","fy","index","description","label","yearSort","cluster"].includes(k)) return false;
          return v !== null && v !== undefined && v !== "";
        });

        const blocks = [];
        blocks.push(`<div class="meta-section"><h3>Description</h3><div>${d.description}</div></div>`);
        blocks.push(`<div class="meta-section"><h3>Metadata</h3><div class="kv">${entries.map(([k,v]) => {
          const val = typeof v === "object" ? JSON.stringify(v, null, 2) : String(v);
          return `<div class="k">${k}</div><div class="v">${escapeHtml(val)}</div>`;
        }).join("")}</div></div>`);
        sidebarContent.innerHTML = blocks.join("");
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
      }

      updateHighlights();

      svg.on("click", () => {
        selectedId = null;
        sidebarTitle.textContent = "Select a node";
        sidebarSub.textContent = "Metadata will appear here.";
        sidebarContent.innerHTML = "";
        updateHighlights();
      });

      window.addEventListener("resize", () => {
        const w = width(), h = height();
        svg.attr("viewBox", [0, 0, w, h]);
      });
    }

    fetch("robotics_knowledge_base_with_predictions.json")
      .then(r => r.json())
      .then(data => render(data))
      .catch(err => {
        sidebarTitle.textContent = "Could not load JSON";
        sidebarSub.textContent = "Check file path and browser permissions.";
        sidebarContent.innerHTML = `<div class="meta-section"><h3>Error</h3><div class="v">${String(err)}</div></div>`;
      });
  </script>
</body>
</html>
