<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotics Knowledge Atlas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --bg:#0e1014; --panel:#161a21; --panel-2:#1c212b; --line:#2a313d;
    --ink:#e8eaed; --ink-dim:#9aa3b0; --ink-faint:#646d7a;
    --metal:#b9c2cd; --accent:#7fd4c1;
    --c-core:#7fd4c1; --c-ai:#e0a8ff; --c-man:#f2c14e;
    --c-ctrl:#7aa7ff; --c-sense:#ff9b87; --c-mat:#a8d08a; --c-other:#6b7686;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  #stage{position:fixed;inset:0}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.grabbing{cursor:grabbing}

  /* ---- header ---- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:baseline;gap:18px;
    padding:18px 26px 16px;
    background:linear-gradient(180deg,rgba(14,16,20,.96),rgba(14,16,20,0));
    pointer-events:none;
  }
  .title{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);
  }
  .title b{color:var(--accent);font-weight:600}
  .subtitle{font-size:12px;color:var(--ink-faint);letter-spacing:.04em}
  .count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.08em;pointer-events:auto}

  /* ---- legend / filters ---- */
  .legend{
    position:fixed;left:26px;top:64px;z-index:30;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:12px 12px 10px;width:210px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  .legend h4{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px;font-weight:600;
  }
  .lg-item{
    display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:5px;
    cursor:pointer;user-select:none;transition:background .15s;
  }
  .lg-item:hover{background:var(--panel-2)}
  .lg-item.off{opacity:.34}
  .swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .lg-label{font-size:12px;color:var(--ink-dim);flex:1}
  .lg-n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint)}
  .legend .hint{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
    font-size:10px;color:var(--ink-faint);line-height:1.5}

  /* ---- search ---- */
  .search{
    position:fixed;left:26px;bottom:24px;z-index:30;width:210px;
  }
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:9px 12px;font-size:12px;
    font-family:inherit;outline:none;transition:border-color .15s;
  }
  .search input:focus{border-color:var(--accent)}
  .search input::placeholder{color:var(--ink-faint)}

  /* ---- tooltip ---- */
  .tip{
    position:fixed;z-index:50;pointer-events:none;display:none;
    background:rgba(20,24,31,.97);border:1px solid var(--line);
    border-radius:7px;padding:9px 11px;max-width:240px;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  .tip .t-name{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:3px;line-height:1.3}
  .tip .t-meta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);letter-spacing:.04em}

  /* ---- detail panel ---- */
  .panel{
    position:fixed;top:0;right:0;height:100%;width:340px;z-index:40;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.45);
  }
  .panel.open{transform:translateX(0)}
  .panel-in{padding:26px 24px 40px}
  .p-close{
    position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:6px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
    cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .p-close:hover{background:var(--accent);color:#0e1014;border-color:var(--accent)}
  .p-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .p-eyebrow .dot{width:9px;height:9px;border-radius:3px}
  .p-title{font-size:21px;font-weight:600;line-height:1.2;margin-bottom:18px;letter-spacing:-.01em}
  .p-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
  .p-stat{background:var(--panel);padding:11px 12px}
  .p-stat .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
  .p-stat .v{font-size:16px;font-weight:600;color:var(--ink);font-family:"IBM Plex Mono",monospace}
  .p-sec{margin-bottom:18px}
  .p-sec h5{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .p-sec p{font-size:13px;line-height:1.55;color:var(--ink-dim)}
  .crit{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
    font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
  .crit.high{color:#ff9b87;border-color:#5a3530}
  .crit.medium{color:#f2c14e;border-color:#5a4d2a}
  .crit.low{color:#a8d08a;border-color:#3a4a30}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--ink-dim)}
  .applist{list-style:none}
  .applist li{font-size:12.5px;color:var(--ink-dim);line-height:1.5;padding-left:14px;position:relative;margin-bottom:5px}
  .applist li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
    border-radius:50%;background:var(--accent)}

  /* node + link base styles */
  .link{stroke:#39424f;stroke-width:1;fill:none;transition:stroke .2s,stroke-opacity .2s}
  .node circle{stroke:#0e1014;stroke-width:1.5;cursor:pointer;transition:stroke .15s}
  .node.dim{opacity:.12}
  .link.dim{stroke-opacity:.06}
  .axis text{fill:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em}
  .axis line{stroke:var(--line)}
  .axis .domain{stroke:none}
  .eralabel{fill:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){
    .panel{transition:none}
  }
</style>
</head>

  "Materials & Engineering":{c:"var(--c-mat)",hex:"#a8d08a"},
  "Other":{c:"var(--c-other)",hex:"#6b7686"}
};

// ---- prep data ----
const YMIN=1950, YMAX=2050;
const clampYear = y => y==null ? null : Math.max(YMIN, Math.min(YMAX, y));
// undated nodes get placed at far right "undated" lane handled separately via x=null
DATA.nodes.forEach(n=>{ n.cyear = clampYear(n.year); });

const byId = new Map(DATA.nodes.map(n=>[n.id,n]));
const links = DATA.edges.filter(e=>byId.has(e.s)&&byId.has(e.t))
                        .map(e=>({source:e.s,target:e.t}));

// adjacency for highlight
const adj = new Map(DATA.nodes.map(n=>[n.id,new Set()]));
links.forEach(l=>{ adj.get(l.source).add(l.target); adj.get(l.target).add(l.source); });

const rScale = d3.scaleSqrt().domain([0, d3.max(DATA.nodes,d=>d.rel)||1]).range([3.5,16]);

// ---- svg scaffold ----
const svg = d3.select("#svg");
let W = window.innerWidth, H = window.innerHeight;
const MARGIN = {top:120,right:360,bottom:54,left:250};
const UNDATED_W = 90; // lane on the right for undated nodes

function plotWidth(){ return Math.max(400, W - MARGIN.left - MARGIN.right - UNDATED_W); }

const x = d3.scaleLinear().domain([YMIN,YMAX]);
function layoutX(){ x.range([MARGIN.left, MARGIN.left + plotWidth()]); }
layoutX();
const undatedX = () => MARGIN.left + plotWidth() + 50;

const root = svg.append("g");           // zoom container
const gGrid = root.append("g");
const gLink = root.append("g");
const gNode = root.append("g");
const gAxis = svg.append("g");          // axis fixed (not zoomed vertically but zoom transforms applied)

// zoom
const zoom = d3.zoom().scaleExtent([0.4,6]).on("zoom",(ev)=>{
  root.attr("transform", ev.transform);
  gAxis.attr("transform", `translate(${ev.transform.x},0) scale(${ev.transform.k},1)`);
  gAxis.selectAll("text").attr("transform",`scale(${1/ev.transform.k},1)`);
});
svg.call(zoom)
   .on("mousedown.cursor",()=>svg.classed("grabbing",true))
   .on("mouseup.cursor",()=>svg.classed("grabbing",false));

// ---- draw timeline axis + era bands ----
function drawAxis(){
  gGrid.selectAll("*").remove();
  gAxis.selectAll("*").remove();
  const ticks = d3.range(1950,2051,10);
  // vertical gridlines
  gGrid.selectAll("line.grid").data(ticks).join("line")
    .attr("class","grid")
    .attr("x1",d=>x(d)).attr("x2",d=>x(d))
    .attr("y1",MARGIN.top-40).attr("y2",H-MARGIN.bottom)
    .attr("stroke","var(--line)").attr("stroke-opacity",0.35);
  // undated divider
  gGrid.append("line")
    .attr("x1",undatedX()-26).attr("x2",undatedX()-26)
    .attr("y1",MARGIN.top-40).attr("y2",H-MARGIN.bottom)
    .attr("stroke","var(--line)").attr("stroke-dasharray","3 4");
  gGrid.append("text").attr("class","eralabel")
    .attr("x",undatedX()+12).attr("y",MARGIN.top-22)
    .attr("text-anchor","middle").text("undated");
  // "now" marker
  gGrid.append("line")
    .attr("x1",x(2026)).attr("x2",x(2026))
    .attr("y1",MARGIN.top-40).attr("y2",H-MARGIN.bottom)
    .attr("stroke","var(--accent)").attr("stroke-opacity",.4).attr("stroke-dasharray","2 5");
  gGrid.append("text").attr("class","eralabel")
    .attr("x",x(2026)).attr("y",MARGIN.top-22).attr("text-anchor","middle")
    .attr("fill","var(--accent)").text("now");

  const axis = d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format("d")).tickSize(6);
  gAxis.attr("transform",`translate(0,0)`);
  gAxis.append("g").attr("class","axis")
    .attr("transform",`translate(0,${H-MARGIN.bottom})`)
    .call(axis);
}

// ---- force simulation: x locked to year, y free ----
const sim = d3.forceSimulation(DATA.nodes)
  .force("x", d3.forceX(d=> d.cyear==null ? undatedX() : x(d.cyear)).strength(1))
  .force("y", d3.forceY(H/2 + 10).strength(0.04))
  .force("link", d3.forceLink(links).id(d=>d.id).distance(26).strength(0.18))
  .force("collide", d3.forceCollide(d=>rScale(d.rel)+2.5).strength(.9))
  .force("charge", d3.forceManyBody().strength(-14))
  .alpha(1).alphaDecay(0.022);

let linkSel, nodeSel;
function draw(){
  drawAxis();
  linkSel = gLink.selectAll("path.link").data(links).join("path").attr("class","link");
  nodeSel = gNode.selectAll("g.node").data(DATA.nodes,d=>d.id).join(enter=>{
    const g = enter.append("g").attr("class","node");
    g.append("circle")
      .attr("r",d=>rScale(d.rel))
      .attr("fill",d=>CAT[d.cat].hex);
    return g;
  });

  nodeSel.select("circle").attr("r",d=>rScale(d.rel));

  nodeSel
    .on("mouseenter",(ev,d)=>hover(d,true))
    .on("mousemove",(ev)=>moveTip(ev))
    .on("mouseleave",(ev,d)=>hover(d,false))
    .on("click",(ev,d)=>{ ev.stopPropagation(); select(d); })
    .call(d3.drag()
      .on("start",(ev,d)=>{ if(!ev.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on("end",(ev,d)=>{ if(!ev.active) sim.alphaTarget(0); d.fy=null; /* keep x locked via force */ }));
}

sim.on("tick",()=>{
  if(!linkSel) return;
  linkSel.attr("d",d=>{
    const sx=d.source.x, sy=d.source.y, tx=d.target.x, ty=d.target.y;
    const mx=(sx+tx)/2;
    return `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
  });
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
});

// ---- tooltip ----
const tip=document.getElementById("tip"),tipName=document.getElementById("tipName"),tipMeta=document.getElementById("tipMeta");
function moveTip(ev){
  tip.style.left=(ev.clientX+14)+"px";
  tip.style.top=(ev.clientY+14)+"px";
}
function hover(d,on){
  if(on){
    tipName.textContent=d.title;
    tipMeta.textContent=`${d.cat.toUpperCase()} · ${d.year?d.year:"undated"} · ${d.rel} links`;
    tip.style.display="block";
    highlight(d.id);
  }else{
    tip.style.display="none";
    if(!selectedId) highlight(null);
  }
}

// ---- highlight neighborhood ----
function highlight(id){
  if(!nodeSel) return;
  if(id==null){
    nodeSel.classed("dim",false);
    linkSel.classed("dim",false).attr("stroke",null);
    return;
  }
  const keep=adj.get(id); keep.add(id);
  nodeSel.classed("dim",d=>!keep.has(d.id));
  linkSel.classed("dim",l=>!(l.source.id===id||l.target.id===id))
         .attr("stroke",l=>(l.source.id===id||l.target.id===id)?"var(--accent)":null);
}

// ---- selection / detail panel ----
let selectedId=null;
const panel=document.getElementById("panel");
function select(d){
  selectedId=d.id; highlight(d.id);
  const cc=CAT[d.cat].hex;
  const crit=(d.crit||"medium").toLowerCase();
  let html=`<div class="p-eyebrow"><span class="dot" style="background:${cc}"></span>${d.cat}</div>`;
  html+=`<div class="p-title">${esc(d.title)}</div>`;
  html+=`<div class="p-stats">
    <div class="p-stat"><div class="k">Year</div><div class="v">${d.year||"—"}</div></div>
    <div class="p-stat"><div class="k">Relationships</div><div class="v">${d.rel}</div></div>
    <div class="p-stat"><div class="k">Links found</div><div class="v">${d.links}</div></div>
    <div class="p-stat"><div class="k">Depth</div><div class="v">${d.depth}</div></div>
  </div>`;
  html+=`<div class="p-sec"><h5>Criticality</h5><span class="crit ${crit}">${crit}</span></div>`;
  if(d.impact) html+=`<div class="p-sec"><h5>Projected impact</h5><p>${esc(d.impact)}</p></div>`;
  if(d.apps&&d.apps.length){
    html+=`<div class="p-sec"><h5>Emerging applications</h5><ul class="applist">`+
      d.apps.map(a=>`<li>${esc(a)}</li>`).join("")+`</ul></div>`;
  }
  if(d.conv&&d.conv.length){
    html+=`<div class="p-sec"><h5>Convergence with</h5><div class="chips">`+
      d.conv.map(c=>`<span class="chip">${esc(c)}</span>`).join("")+`</div></div>`;
  }
  const par=d.parent?byId.get(d.parent):null;
  if(par) html+=`<div class="p-sec"><h5>Derives from</h5><div class="chips"><span class="chip" style="cursor:pointer" data-goto="${esc(par.id)}">${esc(par.title)}</span></div></div>`;
  document.getElementById("panelBody").innerHTML=html;
  panel.classList.add("open");
  document.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{const t=byId.get(el.dataset.goto);if(t)select(t);});
}
document.getElementById("pClose").onclick=()=>{panel.classList.remove("open");selectedId=null;highlight(null);};
svg.on("click",()=>{panel.classList.remove("open");selectedId=null;highlight(null);});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ---- legend / category filter ----
const active=new Set(Object.keys(CAT));
const counts={};DATA.nodes.forEach(n=>counts[n.cat]=(counts[n.cat]||0)+1);
const legendItems=document.getElementById("legendItems");
Object.keys(CAT).forEach(cat=>{
  if(!counts[cat])return;
  const row=document.createElement("div");row.className="lg-item";row.dataset.cat=cat;
  row.innerHTML=`<span class="swatch" style="background:${CAT[cat].hex}"></span>
    <span class="lg-label">${cat}</span><span class="lg-n">${counts[cat]}</span>`;
  row.onclick=()=>{
    if(active.has(cat)){active.delete(cat);row.classList.add("off");}
    else{active.add(cat);row.classList.remove("off");}
    applyFilter();
  };
  legendItems.appendChild(row);
});
function applyFilter(){
  nodeSel.style("display",d=>active.has(d.cat)?null:"none");
  linkSel.style("display",l=>active.has(l.source.cat)&&active.has(l.target.cat)?null:"none");
  updateCount();
}
function updateCount(){
  const vis=DATA.nodes.filter(d=>active.has(d.cat)).length;
  document.getElementById("count").textContent=`${vis} / ${DATA.nodes.length} articles`;
}

// ---- search ----
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!nodeSel)return;
  if(!q){nodeSel.classed("dim",false);if(selectedId)highlight(selectedId);return;}
  let hit=null;
  nodeSel.classed("dim",d=>{
    const m=d.title.toLowerCase().includes(q);
    if(m&&!hit)hit=d;
    return !m;
  });
  if(hit){
    const t=d3.zoomTransform(svg.node());
    // gentle nudge highlight only; no auto-pan to avoid disorientation
  }
});

// ---- init ----
draw();
updateCount();
window.addEventListener("resize",()=>{
  W=window.innerWidth;H=window.innerHeight;
  layoutX();
  sim.force("x").x(d=>d.cyear==null?undatedX():x(d.cyear));
  sim.force("y").y(H/2+10);
  sim.alpha(.4).restart();
  draw();
});

// settle then gentle fit
setTimeout(()=>sim.alpha(.3).restart(),200);
</script>
</body>
</html>
